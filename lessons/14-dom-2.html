      { md: `<h2>Changing the shape of the tree</h2>
      <p>In DOM I you found existing elements and changed their content and attributes. Now we change the tree's
      <em>structure</em>: add new nodes, move them, copy them, and take them away. Together with reading and updating, these are
      the classic <strong>CRUD</strong> operations — create, read, update, delete — applied to a page.</p>
      <p>Creating an element is always two steps:</p>
      <ol>
        <li><strong>Create</strong> it with <code>document.createElement("tag")</code> and set it up (text, classes, attributes).
        At this point it exists only in memory — it's not on the page.</li>
        <li><strong>Attach</strong> it somewhere in the tree. Only then does the browser lay it out and draw it.</li>
      </ol>` },

      <p>A node can only be in one place. Appending a node that's <em>already</em> on the page doesn't copy it — it
      <strong>moves</strong> it. To copy, <strong>clone</strong> it: <code>el.cloneNode(true)</code> copies it with all its
      descendants (<code>false</code> copies just the element). Clones don't bring event listeners along.</p>` },

      <p><code>el.remove()</code> takes an element out of the tree (together with everything inside it).
      <code>parent.replaceChildren()</code> removes all of a parent's children at once, and
      <code>parent.replaceChildren(a, b)</code> swaps in new ones. A removed element still exists as an object while your code holds

      { title: "Create, Read, Update, Delete", html: `<ul id="list"><li>First</li></ul>

let count = 1;

function addItem() {
  count++;

  li.textContent = "Item " + count;          // update

  console.log("items now:", document.querySelectorAll("#list li").length);   // read

function removeLast() {
  const last = document.querySelector("#list li:last-child");

      { md: `<h2>Building pages from data</h2>
      <p>Most real pages show <em>data</em> — rows from a database, results from an API. The reliable way to keep the page in step
      with the data is the <strong>render</strong> pattern:</p>
      <ol>
        <li>keep the data (the <strong>state</strong>) in JavaScript variables — arrays and objects;</li>
        <li>write one <code>render()</code> function that rebuilds the relevant part of the page from the state;</li>
        <li>whenever the state changes, change the <em>data</em>, then call <code>render()</code>.</li>
      </ol>
      <p>You never patch the page by hand in several places, so it can't drift out of sync with the data. (This is exactly the
      idea React automates in lesson 22.)</p>` },
      { title: "A table rendered from data", html: `<table border="1" cellpadding="4">
  <thead><tr><th>Name</th><th>Year</th><th>GPA</th></tr></thead>

</table>`, code: `

  { name: "Ada", year: 2, gpa: 3.9 },
  { name: "Alan", year: 3, gpa: 3.4 },
  { name: "Grace", year: 2, gpa: 3.7 },

      { title: "State → render()", html: `<input id="name" placeholder="Name"> <input id="score" placeholder="Score" size="5">
<button id="add">Add</button> <button id="sort">Sort by score</button>
<ol id="board"></ol>
<p id="summary"></p>`, code: `
// 1. the state
const players = [{ name: "Ada", score: 90 }, { name: "Alan", score: 75 }];

// 2. one function that draws the page from the state
function render() {
  const board = document.getElementById("board");
  board.replaceChildren();
  players.forEach((p, i) => {
    const li = document.createElement("li");
    li.textContent = p.name + " — " + p.score + " ";
    const del = document.createElement("button");
    del.textContent = "✕";
    del.addEventListener("click", () => {
      players.splice(i, 1);        // change the data…
      render();                    // …then re-render
    });
    li.append(del);
    board.append(li);
  });
  const best = Math.max(...players.map(p => p.score));
  document.getElementById("summary").textContent =
    players.length ? players.length + " players, best score " + best : "No players";
}

// 3. events change the state, then call render()
document.getElementById("add").addEventListener("click", () => {
  const name = document.getElementById("name").value.trim();
  const score = Number(document.getElementById("score").value);
  if (name && !Number.isNaN(score)) {
    players.push({ name, score });
    render();
  }
});
document.getElementById("sort").addEventListener("click", () => {
  players.sort((a, b) => b.score - a.score);
  render();
});

render();
` },

      { md: `<h2>Working with the browser's rendering</h2>
      <p>Every structural change can make the browser recompute layout. It's smart about it: it waits and does the work once,
      after your code finishes. But if your code <em>reads</em> a layout value (like <code>offsetHeight</code>) right after a
      change, the browser has to lay out the page immediately to answer — and doing that on every pass of a loop
      (<strong>layout thrashing</strong>) gets slow. Two habits help: batch writes and reads separately, and build big pieces off-page
      in a <code>DocumentFragment</code> — an invisible container — then attach it in one step.</p>` },
      { title: "Batching with a DocumentFragment", html: `<p id="info"></p>
<div id="a" style="height:60px;overflow:auto;border:1px solid #ccc"></div>
<div id="b" style="height:60px;overflow:auto;border:1px solid #ccc;margin-top:4px"></div>`, code: `
// Layout measurements need a laid-out page, so this runs once it has loaded.
window.addEventListener("load", () => {
const N = 1000;

// Slow: attach each row, then read a layout value — forces layout every time.
let t0 = performance.now();
const a = document.getElementById("a");
for (let i = 0; i < N; i++) {
  const div = document.createElement("div");
  div.textContent = "row " + i;
  a.append(div);
  a.scrollHeight;                     // a layout read inside the loop
}
const slow = performance.now() - t0;

// Fast: build everything in a fragment, attach once, read once.
t0 = performance.now();
const frag = document.createDocumentFragment();
for (let i = 0; i < N; i++) {
  const div = document.createElement("div");
  div.textContent = "row " + i;
  frag.append(div);
}
const b = document.getElementById("b");
b.append(frag);                       // the fragment's children move in; the fragment is now empty
b.scrollHeight;
const fast = performance.now() - t0;

console.log(\`one at a time with reads: \${slow.toFixed(1)} ms\`);
console.log(\`fragment, one attach:     \${fast.toFixed(1)} ms\`);
document.getElementById("info").textContent = N + " rows in each box";
});
` },

      { md: `<p>Animation uses the browser's drawing rhythm directly: <code>requestAnimationFrame(fn)</code> asks the browser to call
      <code>fn</code> just before it next paints the screen (about 60 times a second). Change the DOM a little each frame and it
      moves smoothly — and it pauses automatically in a hidden tab.</p>` },
      { title: "requestAnimationFrame", html: `<div style="position:relative;height:40px;border:1px solid #ddd">
  <div id="ball" style="position:absolute;width:30px;height:30px;top:4px;border-radius:50%;background:tomato"></div>
</div>
<button id="go">Animate</button>`, code: `
const ball = document.getElementById("ball");

function animate() {
  const start = performance.now();
  const width = ball.parentElement.clientWidth - 32;
  function frame(now) {
    const t = Math.min((now - start) / 1500, 1);          // 0 → 1 over 1.5 s
    ball.style.left = Math.round(width * t) + "px";
    if (t < 1) {
      requestAnimationFrame(frame);
    } else {
      console.log("done");
    }
  }
  requestAnimationFrame(frame);
}

document.getElementById("go").addEventListener("click", animate);
` },

      { md: `<h2>Navigating the tree</h2>
      <p>Sometimes you have one element and need its relatives — the row a clicked button is in, the next item in a list, the
      heading above a paragraph.</p>
      <table>
        <tr><th>Property</th><th>Gives</th></tr>
        <tr><td><code>el.parentElement</code></td><td>the parent element (<code>null</code> above <code>&lt;html&gt;</code>)</td></tr>
        <tr><td><code>el.children</code></td><td>the child <em>elements</em> (live)</td></tr>
        <tr><td><code>el.firstElementChild</code>, <code>el.lastElementChild</code></td><td>first / last child element</td></tr>
        <tr><td><code>el.nextElementSibling</code>, <code>el.previousElementSibling</code></td><td>neighbours</td></tr>
        <tr><td><code>el.closest(selector)</code></td><td>the nearest ancestor (or the element itself) matching the selector</td></tr>
        <tr><td><code>el.contains(other)</code></td><td>whether <code>other</code> is inside <code>el</code></td></tr>
      </table>
      <div class="callout warn"><strong>Elements versus nodes.</strong> <code>childNodes</code>, <code>firstChild</code>,
      <code>nextSibling</code> and <code>parentNode</code> also exist — and include <em>text nodes</em>, like the invisible whitespace
      between tags (DOM I). Use the <code>…Element…</code> versions unless you really want text nodes.</div>` },
      { title: "Navigating", html: `<div id="outer">
  <p id="first">One</p>
  <p id="second">Two <em id="em">emphasis</em></p>
  <p>Three</p>
</div>`, code: `
const second = document.getElementById("second");
console.log(second.parentElement.id);
console.log(second.previousElementSibling.textContent);
console.log(second.nextElementSibling.textContent);
console.log(document.getElementById("outer").children.length, "children");
console.log(document.getElementById("em").closest("div").id);
console.log(document.getElementById("outer").contains(document.getElementById("em")));

console.log(second.nextSibling.nodeName, "← nextSibling is the whitespace text node");

// walk up from <em> to the top, recording tag names
let node = document.getElementById("em");
const path = [];
while (node !== null) {
  path.unshift(node.tagName.toLowerCase());
  node = node.parentElement;

console.log(path.join(" > "));

      { md: `<h3>Walking the whole tree, recursively</h3>
      <p>The DOM is nested to any depth, which makes it a perfect fit for recursion (lesson 17): to visit an element, handle it,
      then visit each of its children the same way.</p>` },
      { title: "An outline of the tree", html: `<div id="page">
  <header><h1>Title</h1><nav><a href="#">Home</a><a href="#">About</a></nav></header>
  <main>
    <section><h2>Intro</h2><p>Some <b>bold</b> text.</p></section>
    <section><h2>More</h2><ul><li>a</li><li>b</li></ul></section>
  </main>
</div>`, code: `
function outline(el, depth = 0) {
  let text = "  ".repeat(depth) + el.tagName.toLowerCase() + (el.id ? "#" + el.id : "") + "\\n";
  for (const child of el.children) {
    text += outline(child, depth + 1);
  }
  return text;
}

function countTags(el, counts = {}) {
  const tag = el.tagName.toLowerCase();
  counts[tag] = (counts[tag] ?? 0) + 1;
  for (const child of el.children) {
    countTags(child, counts);
  }
  return counts;
}

const page = document.getElementById("page");
console.log(outline(page));
console.log(countTags(page));
` },
      { md: `<h3>A DOM traversal tool</h3>
      <p>This is the program we wrote together in class. It can be pasted into any page's DevTools console: it adds Parent, Child
      and Sibling buttons to the top of the page; each press moves a "current element" through the tree and outlines it in the
      next color. The buttons call methods on <code>window.domTraversal</code> — an object of closures (lesson 12) holding the
      current element privately. (One fix from the original: it starts from <code>container.nextElementSibling</code>, so the
      first move never lands on a text node.)</p>` },
      { title: "Parent, child, sibling", html: `<h3>Recipe</h3>
<div class="box">
  <p>Ingredients:</p>
  <ul>
    <li>Flour</li>
    <li>Milk <em>(cold)</em></li>
    <li>Eggs</li>
  </ul>
</div>
<p>Enjoy!</p>`, code: `
function domTraversalInit() {
  const container = document.createElement("div");
  container.innerHTML =
    '<button onClick="domTraversal.parent()">Parent</button>' +
    '<button onClick="domTraversal.child()">Child</button>' +
    '<button onClick="domTraversal.sibling()">Sibling</button>';
  document.body.firstElementChild.before(container);

  const colors = ["red", "green", "gold", "orange", "blue"];
  let curElem = container.nextElementSibling;
  let nextColor = 0;

  function highlite(e) {
    e.style.border = \`thick solid \${colors[nextColor]}\`;
    nextColor += 1;
    nextColor %= colors.length;
    console.log("now at <" + e.tagName.toLowerCase() + ">");
  }

  function parent() {
    if (curElem.parentElement === null) {
      return;
    }
    curElem = curElem.parentElement;
    highlite(curElem);
  }

  function child() {
    if (curElem.firstElementChild === null) {
      return;
    }
    curElem = curElem.firstElementChild;
    highlite(curElem);
  }

  function sibling() {
    if (curElem.nextElementSibling === null) {
      return;
    }
    curElem = curElem.nextElementSibling;
    highlite(curElem);
  }

  highlite(curElem);
  window.domTraversal = { parent, child, sibling };
}

domTraversalInit();
` },

        <li>Create with <code>createElement</code> (plus <code>createTextNode</code>), set it up, then attach with <code>append</code>,
        <code>prepend</code>, <code>before</code>, <code>after</code>, <code>replaceWith</code> or <code>insertAdjacentHTML</code>.</li>
        <li>Appending an existing node <strong>moves</strong> it; <code>cloneNode(true)</code> copies it; <code>&lt;template&gt;</code> holds markup to clone.</li>
        <li>Delete with <code>remove()</code> / <code>replaceChildren()</code>.</li>
        <li>Render pattern: state in variables → one <code>render()</code> → change the data, then re-render. Rebuilding with
        <code>innerHTML</code> loses listeners and typed input.</li>
        <li>Batch DOM writes (a <code>DocumentFragment</code>), avoid layout reads in loops, animate with <code>requestAnimationFrame</code>.</li>
        <li>Navigate with <code>parentElement</code>, <code>children</code>, <code>…ElementSibling</code>, <code>closest</code>; walk whole subtrees recursively.</li>
      </ul></div>
