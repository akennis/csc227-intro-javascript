      { md: `<h2>What React is</h2>
      <p><strong>React</strong> is a JavaScript library for building user interfaces (UIs) for web and native platforms. Its
      primary goal is to minimise the bugs that occur when developers build UIs, by abstracting away much of the rendering work
      (all the <code>createElement</code>, <code>textContent</code> and <code>classList</code> calls from lessons 13–14) and letting
      developers concentrate on the UI design.</p>
      <ul>
        <li><strong>Components</strong> — a UI is built from reusable, independent pieces of code. Components can manage their
        own state, and combine to form screens, pages, and apps.</li>
        <li><strong>JSX</strong> — a syntax extension that lets you write HTML-like code inside JavaScript.</li>
        <li><strong>Virtual DOM</strong> — React keeps an ideal representation of the UI in memory, compares it with the previous
        one when data changes, and updates only the parts of the real DOM that differ. That makes pages render efficiently.</li>
        <li><strong>Props</strong> — arguments passed into a component to configure how it renders, maintained outside it.</li>
        <li><strong>State</strong> — data a component manages itself; changing it re-renders the component.</li>
        <li><strong>Extensions</strong> — architecture libraries like Flux, and React Native for mobile apps.</li>
        <li><strong>Open source</strong> — free under the MIT license, maintained by Meta (Facebook) and a community of developers.</li>
      </ul>
      <p>React is often combined with other technologies into a full-stack application — for example, a React front end calling a
      Node API like the ones in lesson 21.</p>` },

      { md: `<h2>React in a single HTML page</h2>
      <p>The quickest way to experiment is one standalone HTML file: load React, ReactDOM, and Babel (which translates JSX into

      <pre class="code" data-lang="html">&lt;div id="root"&gt;&lt;/div&gt;
&lt;script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.development.js"&gt;&lt;/script&gt;
&lt;script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.development.js"&gt;&lt;/script&gt;
&lt;script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js"&gt;&lt;/script&gt;
&lt;script type="text/babel"&gt;
  function App() {
    return &lt;h1&gt;Hello, React!&lt;/h1&gt;;
  }
  ReactDOM.createRoot(document.getElementById("root")).render(&lt;App /&gt;);
&lt;/script&gt;</pre>
      <p>The examples below work the same way: the page loads React for you and translates your JSX before running it. Each

      { md: `<h2>Components and JSX</h2>
      <p>A component is a function whose name starts with a capital letter and that <strong>returns JSX</strong> describing what
      to show. You use it like an HTML tag: <code>&lt;App /&gt;</code>. <code>createRoot(…).render(…)</code> puts it on the page.</p>` },
      { title: "A first component", ...react, code: `
function App() {
  const name = "CSC 227";
  const now = new Date(2024, 10, 4);
  return (
    <div>
      <h1>Hello, {name}!</h1>
      <p>Today is {now.toDateString()}. 6 × 7 = {6 * 7}.</p>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
` },
      { md: `<h3>JSX rules</h3>
      <ul>
        <li><code>{ … }</code> drops any JavaScript <em>expression</em> into the markup — a variable, a calculation, a function call.</li>
        <li>A component returns <strong>one</strong> root element; wrap siblings in a <code>&lt;div&gt;</code> or a fragment
        <code>&lt;&gt;…&lt;/&gt;</code>. Wrap multi-line JSX in parentheses.</li>
        <li>Attributes are camelCase JavaScript names: <code>className</code> (not <code>class</code>), <code>onClick</code>,
        <code>htmlFor</code>. Styles are objects: <code>style={{ color: "red", fontSize: 20 }}</code>.</li>
        <li>Every tag must be closed: <code>&lt;br /&gt;</code>, <code>&lt;img src="…" /&gt;</code>.</li>
        <li>JSX is not HTML in a string — Babel turns <code>&lt;h1&gt;Hi&lt;/h1&gt;</code> into
        <code>React.createElement("h1", null, "Hi")</code>. And text in <code>{…}</code> is always escaped, so user input can't
        inject HTML.</li>
      </ul>` },

      { md: `<h2>Props</h2>
      <p>Props are the arguments passed to a component for initialisation, written like HTML attributes. They let one component
      render differently in different places. Props are maintained <em>outside</em> the component (by whoever renders it), and
      the receiving component must never change them; when the provider changes a prop, the receiving component re-renders.</p>` },
      { title: "Props make components reusable", ...react, code: `
function Greeting({ name, excited = false }) {
  return <h2>Hello, {name}{excited ? "!!!" : "."}</h2>;
}

function Card({ title, children }) {
  return (
    <div style={{ border: "1px solid #ccc", borderRadius: 8, padding: "0.5rem 1rem", marginBottom: 8 }}>
      <h3 style={{ margin: 0 }}>{title}</h3>
      {children}
    </div>
  );
}

function App() {
  return (
    <>
      <Greeting name="Ada" />
      <Greeting name="Alan" excited={true} />
      <Card title="About props">
        <p>Whatever is between the tags arrives as the <code>children</code> prop.</p>
      </Card>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
` },
      { md: `<h3>Lists and conditions</h3>
      <p>Render a list by <code>map</code>-ping an array to elements; give each one a unique <code>key</code> prop so React can
      track it. Render conditionally with <code>&amp;&amp;</code> or the ternary operator.</p>` },
      { title: "Lists, keys, conditional rendering", ...react, code: `
const students = [
  { id: 1, name: "Ada", gpa: 3.9 },
  { id: 2, name: "Alan", gpa: 3.4 },
  { id: 3, name: "Grace", gpa: 3.7 },
];

function StudentList({ students, minGpa }) {
  const shown = students.filter(s => s.gpa >= minGpa);
  if (shown.length === 0) {
    return <p>Nobody qualifies.</p>;
  }
  return (
    <ul>
      {shown.map(s => (
        <li key={s.id}>
          {s.name} — {s.gpa.toFixed(1)} {s.gpa >= 3.8 && <strong>(honors)</strong>}
        </li>
      ))}
    </ul>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <>
    <StudentList students={students} minGpa={3.5} />
    <StudentList students={students} minGpa={4.0} />
  </>
);
` },

      { md: `<h2>State</h2>
      <p>State is data managed <em>within</em> a component, which the component can update itself. <code>useState(initial)</code>
      returns the current value and a function to change it. Calling that setter makes React <strong>re-render</strong> the
      component with the new value — you never touch the DOM yourself. Click the buttons:</p>` },
      { title: "A counter", ...react, code: `
function Counter({ step = 1 }) {
  const [count, setCount] = React.useState(0);
  return (
    <div>
      <p>Count: {count}</p>
      <button onClick={() => setCount(count + step)}>+{step}</button>{" "}
      <button onClick={() => setCount(count - step)} disabled={count === 0}>-{step}</button>{" "}
      <button onClick={() => setCount(0)}>Reset</button>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <>
    <Counter />
    <Counter step={5} />
  </>
);
` },
      { md: `<p>Each <code>&lt;Counter&gt;</code> has its own independent state — just like the closures in lesson 12.</p>
      <h3>Forms: controlled inputs</h3>
      <p>For an input, keep its value in state, pass it as <code>value</code>, and update the state in <code>onChange</code>. The
      state is then always the single source of truth for what's on screen.</p>` },
      { title: "A controlled input", ...react, code: `
function NameForm() {
  const [name, setName] = React.useState("");
  return (
    <div>
      <input value={name} onChange={e => setName(e.target.value)} placeholder="Your name" />
      <p>{name === "" ? "Type your name." : \`Hello, \${name.trim()}! (\${name.length} characters)\`}</p>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<NameForm />);
` },
      { md: `<h3>Lifting state up</h3>
      <p>State within one component can become a <strong>prop</strong> of another. When two components need the same data, move
      the state up to their common parent and pass it down; when that state changes, both re-render. Children change it by
      calling a function the parent passes down as a prop.</p>` },
      { title: "State in the parent, props in the children", ...react, code: `
function TemperatureInput({ label, value, onChange }) {
  return (
    <label style={{ display: "block" }}>
      {label}: <input value={value} onChange={e => onChange(e.target.value)} />
    </label>
  );
}

function Converter() {
  const [celsius, setCelsius] = React.useState("20");
  const c = Number(celsius);
  const f = Number.isNaN(c) ? "" : String(Math.round((c * 9 / 5 + 32) * 10) / 10);
  return (
    <div>
      <TemperatureInput label="Celsius" value={celsius} onChange={setCelsius} />
      <TemperatureInput label="Fahrenheit" value={f}
        onChange={text => setCelsius(String(Math.round((Number(text) - 32) * 5 / 9 * 10) / 10))} />
      <p>{c >= 30 ? "Hot!" : c <= 0 ? "Freezing!" : "Comfortable."}</p>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Converter />);
` },
      { md: `<h3>Effects: loading data</h3>
      <p><code>useEffect(fn, [])</code> runs <code>fn</code> once after the component first appears — the place to start a
      <code>fetch</code>. When the data arrives, store it in state and the component re-renders. (This one uses the course's
      pretend weather server.)</p>` },
      { title: "Fetching in a component", ...react, mock: courseApi, code: `
function Weather({ lat, long, place }) {
  const [temp, setTemp] = React.useState(null);
  const [error, setError] = React.useState(null);

  React.useEffect(() => {
    async function load() {
      try {
        const resp = await fetch(\`https://api.open-meteo.com/v1/forecast?latitude=\${lat}&longitude=\${long}&hourly=temperature_2m\`);
        if (!resp.ok) throw new Error("status " + resp.status);
        const data = await resp.json();
        setTemp(data.hourly.temperature_2m.at(-1));
      } catch (e) {
        setError(e.message);
      }
    }
    load();
  }, [lat, long]);

  if (error) return <p>{place}: error ({error})</p>;
  if (temp === null) return <p>{place}: loading…</p>;
  return <p>{place}: {temp} °C</p>;
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <>
    <Weather place="Middletown, NY" lat={41.4} long={-74.4} />
    <Weather place="Quito" lat={-0.2} long={-78.5} />
    <Weather place="Nowhere" lat={123} long={0} />
  </>
);
` },

      { md: `<h2>npm: a real React app</h2>
      <p>A single HTML page is great for quick experiments, but it's not how you'd build a larger application. Real apps are
      <strong>projects</strong> on your computer, built with Node and <strong>npm</strong>, the Node Package Manager.</p>
      <ul>
        <li>npm hosts more than two million packages ready for your use, at <a href="https://www.npmjs.com/">npmjs.com</a>.</li>
        <li>A project's <code>package.json</code> lists its name, its scripts, and its <strong>dependencies</strong> (packages and
        version ranges). <code>npm install</code> downloads them all into <code>node_modules/</code> (never commit that folder —
        put it in <code>.gitignore</code>).</li>
        <li>Today the usual way to start a React app is <a href="https://vite.dev/">Vite</a>:
        <pre class="code" data-lang="text">npm create vite@latest my-app -- --template react
cd my-app
npm install
npm run dev        # starts a development server and prints its URL</pre>
        (Older tutorials use Create React App, which is now deprecated. VS Code's
        <a href="https://code.visualstudio.com/docs/nodejs/reactjs-tutorial">React tutorial</a> shows how to edit and debug a
        React app in the editor.)</li>
      </ul>
      <h3>Using a package</h3>
      <p>A small example package: <a href="https://www.npmjs.com/package/zip-state">zip-state</a>, which looks up the US state for
      a ZIP code. Add it to your app by installing it, import it into your code, then call it from a component:</p>
      <pre class="code" data-lang="text">npm i zip-state</pre>
      <pre class="code">import zipState from 'zip-state';

function Home() {
  return &lt;h1&gt;Home {zipState('10924')}&lt;/h1&gt;;   // "Home NY"
}</pre>
      <p>A larger example: Microsoft's <a href="https://www.npmjs.com/package/@fluentui/react-components">Fluent UI</a> component
      library, which gives you ready-made, styled components:</p>
      <pre class="code" data-lang="text">npm i @fluentui/react-components</pre>
      <pre class="code">import { FluentProvider, teamsLightTheme, Button } from '@fluentui/react-components';

function App() {
  return (
    &lt;FluentProvider theme={teamsLightTheme}&gt;
      &lt;Button appearance="primary"&gt;I am a button.&lt;/Button&gt;
    &lt;/FluentProvider&gt;
  );
}</pre>
      <div class="callout warn"><strong>Choosing packages.</strong> Every dependency is someone else's code running in your app.
      Prefer well-maintained, widely used packages; check the weekly downloads, last publish date, and license on npmjs.com; and
      run <code>npm audit</code> to find known vulnerabilities.</div>
      <h3>Project ideas</h3>
      <p>A React tic-tac-toe game (React's own tutorial at <a href="https://react.dev/learn/tutorial-tic-tac-toe">react.dev</a>),
